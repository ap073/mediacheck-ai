<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400, initial-scale=1.0">
  <title>MediaCheck AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">MediaCheck AI</h1>
          <span class="brand-subtitle">AI Media Detector</span>
        </div>
      </div>
      <div class="header-actions">
        <span id="backend-status" class="status-indicator" title="Backend connection status">●</span>
        <button id="btn-settings-toggle" class="icon-button" title="Configure Backend API URL">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Settings Pane (collapsible) -->
    <div id="settings-pane" class="settings-pane hidden">
      <label for="input-api-url" class="field-label">Backend API URL:</label>
      <div class="settings-row">
        <input type="text" id="input-api-url" class="text-input" placeholder="http://localhost:8000" />
        <button id="btn-save-settings" class="btn-sm">Save</button>
      </div>
      <p class="helper-text">Point to your local or deployed FastAPI instance.</p>
    </div>

    <!-- Quick File Selector Buttons -->
    <section class="upload-section">
      <input type="file" id="file-input-image" accept="image/jpeg,image/png,image/webp" class="hidden" />
      <input type="file" id="file-input-video" accept="video/mp4,video/quicktime,video/webm" class="hidden" />

      <div class="file-picker-grid">
        <button id="btn-pick-image" class="file-picker-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
            <circle cx="9" cy="9" r="2"/>
            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
          </svg>
          <span>Select Image</span>
        </button>
        <button id="btn-pick-video" class="file-picker-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="23 7 16 12 23 17 23 7"/>
            <rect width="14" height="14" x="1" y="5" rx="2" ry="2"/>
          </svg>
          <span>Select Video</span>
        </button>
      </div>

      <!-- Selected File Capsule -->
      <div id="selected-file-capsule" class="file-capsule hidden">
        <span id="capsule-name" class="capsule-name">file.jpg</span>
        <button id="btn-capsule-clear" class="capsule-remove">✕</button>
      </div>

      <button id="btn-check-ai" class="btn-primary" disabled>
        <span>Check for AI</span>
      </button>
    </section>

    <!-- Loading State -->
    <div id="loading-state" class="loading-state hidden">
      <div class="spinner"></div>
      <span id="loading-text">Analyzing neural patterns...</span>
    </div>

    <!-- Error Banner -->
    <div id="error-banner" class="error-banner hidden">
      <span id="error-message">Error message</span>
    </div>

    <!-- Results Section -->
    <section id="result-card" class="result-card hidden">
      <div class="result-header">
        <span id="result-category-badge" class="category-badge">Category</span>
        <span id="result-score" class="score-display">0%</span>
      </div>

      <div class="score-meter-container">
        <div id="score-meter-bar" class="score-meter-bar"></div>
      </div>

      <p id="result-confidence" class="confidence-label">Confidence statement</p>
      <p id="result-explanation" class="result-summary">Explanation</p>

      <div class="result-actions">
        <a id="btn-open-website" href="http://localhost:3000" target="_blank" class="btn-link">
          Open Full Website Report ↗
        </a>
      </div>
    </section>

    <!-- Context Menu Hint -->
    <footer class="footer-hint">
      <p>💡 Tip: Right-click any image on the web and select <strong>"Check image with MediaCheck AI"</strong>.</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
